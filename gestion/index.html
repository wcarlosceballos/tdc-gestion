<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d36">
  <meta name="description" content="Panel de demostración local para gestionar propuestas, órdenes de servicio y cuentas de cobro.">
  <title>TDC Gestión | Control de servicios</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación de TDC Gestión">
      <a class="brand" href="#inicio" aria-label="TDC Gestión, inicio">
        <img class="brand-logo-mark" src="../assets/tdc-mark.svg" alt="" aria-hidden="true">
        <span class="brand-copy"><strong>Tienda Digital</strong><small>GESTIÓN DE SERVICIOS</small></span>
      </a>

      <p class="nav-label">OPERACIÓN</p>
      <nav class="side-nav">
        <button class="nav-item is-active" type="button" data-view="dashboard"><span class="nav-icon" aria-hidden="true">⌂</span>Resumen</button>
        <button class="nav-item" type="button" data-view="proposals"><span class="nav-icon" aria-hidden="true">▤</span>Propuestas <span class="nav-count" id="proposal-nav-count">0</span></button>
        <button class="nav-item" type="button" data-view="orders"><span class="nav-icon" aria-hidden="true">▣</span>Órdenes de servicio</button>
        <button class="nav-item" type="button" data-view="accounts"><span class="nav-icon" aria-hidden="true">$</span>Cuentas de cobro</button>
      </nav>

      <p class="nav-label nav-label-secondary">REGISTROS</p>
      <nav class="side-nav">
        <button class="nav-item" type="button" data-view="clients"><span class="nav-icon" aria-hidden="true">◉</span>Clientes</button>
      </nav>

      <div class="sidebar-bottom">
        <span class="sidebar-dot" aria-hidden="true"></span>
        <span><strong>Tienda Digital Colombia</strong><small>Lorica, Córdoba</small></span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>TIENDA DIGITAL</span><b>/</b><span id="current-section">RESUMEN</span></div>
        <div class="top-actions">
          <button class="button button-quiet button-small" type="button" data-action="settings"><span aria-hidden="true">⚙</span> Datos de emisión</button>
          <button class="user-button" type="button" aria-label="Propietario" title="Espacio de trabajo local"><span class="user-avatar">TD</span><span class="user-label">Propietario</span></button>
        </div>
      </header>

      <div class="local-notice" role="note">
        <span class="notice-icon" aria-hidden="true">i</span>
        <p><strong>Demostración local.</strong> Los registros quedan en este navegador. Usa datos ficticios; este prototipo no protege ni sincroniza información personal.</p>
        <button type="button" class="notice-close" aria-label="Cerrar aviso" data-action="dismiss-notice">×</button>
      </div>

      <section id="view-content" class="view-content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
    <div id="dialog-content"></div>
  </dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
